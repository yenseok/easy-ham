server {
    # 80번 포트(HTTP)로 들어오는 요청을 수신합니다.
    listen 80;

    # API 요청 (/api/...)을 백엔드 컨테이너로 전달합니다.
    # 'backend'는 docker-compose.yml에 정의된 백엔드 서비스의 이름입니다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 외 모든 요청은 프론트엔드 정적 파일을 제공합니다.
    location / {
        # Dockerfile에서 복사한 빌드 결과물이 위치한 경로입니다.
        root /usr/share/nginx/html;
        
        # React/Vue 등 SPA의 라우팅이 정상 동작하도록 설정합니다.
        try_files $uri $uri/ /index.html;
    }
}