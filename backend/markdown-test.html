<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRHAM 마크다운 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 24px;
            height: 800px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }

        .status.connected {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .posts-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
        }

        .post-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .post-card:hover {
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .post-card.selected {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .post-title {
            font-weight: 600;
            font-size: 14px;
            color: #1a1a1a;
        }

        .post-category {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }

        .category-학사 { background: #dbeafe; color: #1e40af; }
        .category-취업 { background: #fef3c7; color: #92400e; }

        .post-info {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }

        .post-preview {
            font-size: 13px;
            color: #4b5563;
            margin-top: 8px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .viewer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fafafa;
        }

        .empty-state {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 14px;
        }

        /* 마크다운 스타일 */
        .markdown-content {
            line-height: 1.8;
            color: #1a1a1a;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .markdown-content h1 { font-size: 28px; }
        .markdown-content h2 { font-size: 24px; }
        .markdown-content h3 { font-size: 20px; }

        .markdown-content p {
            margin-bottom: 16px;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 16px;
            padding-left: 24px;
        }

        .markdown-content li {
            margin-bottom: 8px;
        }

        .markdown-content a {
            color: #2563eb;
            text-decoration: none;
        }

        .markdown-content a:hover {
            text-decoration: underline;
        }

        .markdown-content code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
        }

        .markdown-content pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        .markdown-content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .markdown-content blockquote {
            border-left: 4px solid #e5e7eb;
            padding-left: 16px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .markdown-content strong {
            font-weight: 600;
        }

        .detail-header {
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .detail-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .detail-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #6b7280;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        button {
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            transition: all 0.2s;
        }

        button:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        button.primary {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        button.primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        .toggle-group {
            display: flex;
            gap: 0;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            overflow: hidden;
        }

        .toggle-group button {
            border: none;
            border-radius: 0;
            border-right: 1px solid #d1d5db;
        }

        .toggle-group button:last-child {
            border-right: none;
        }

        .toggle-group button.active {
            background: #3b82f6;
            color: white;
        }

        .raw-view {
            background: #1f2937;
            color: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 왼쪽: 공지사항 목록 -->
    <div class="panel">
        <h2>
            <span class="status" id="status"></span>
            실시간 공지사항
        </h2>
        <div class="controls">
            <button class="primary" onclick="connectSSE()">연결</button>
            <button onclick="disconnectSSE()">연결 해제</button>
            <button onclick="clearPosts()">목록 초기화</button>
        </div>
        <div class="posts-list" id="postsList">
            <div class="empty-state">SSE 연결 대기중...</div>
        </div>
    </div>

    <!-- 오른쪽: 선택된 공지 상세보기 -->
    <div class="panel">
        <h2>공지사항 상세</h2>
        <div class="controls">
            <div class="toggle-group">
                <button class="active" onclick="switchView('markdown')">마크다운</button>
                <button onclick="switchView('raw')">원본 텍스트</button>
            </div>
        </div>
        <div class="viewer" id="viewer">
            <div class="empty-state">공지사항을 선택해주세요</div>
        </div>
    </div>
</div>

<!-- Marked.js 라이브러리 (마크다운 파싱) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    let eventSource = null;
    let posts = [];
    let selectedPost = null;
    let currentView = 'markdown';

    // SSE 연결
    function connectSSE() {
        if (eventSource) {
            alert('이미 연결되어 있습니다.');
            return;
        }

        // TODO: 실제 accessToken을 쿠키에서 가져오거나 입력받기
        eventSource = new EventSource('http://localhost:8080/api/v1/sse/subscribe', {
            withCredentials: true
        });

        eventSource.addEventListener('connected', (event) => {
            console.log('SSE 연결 성공:', event.data);
            updateStatus(true);
        });

        eventSource.addEventListener('newPost', (event) => {
            console.log('새 공지:', event.data);
            const post = JSON.parse(event.data);
            addPost(post);
        });

        eventSource.onerror = (error) => {
            console.error('SSE 에러:', error);
            updateStatus(false);
            eventSource.close();
            eventSource = null;
        };
    }

    // SSE 연결 해제
    function disconnectSSE() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
            updateStatus(false);
            console.log('SSE 연결 해제');
        }
    }

    // 연결 상태 업데이트
    function updateStatus(connected) {
        const status = document.getElementById('status');
        if (connected) {
            status.classList.add('connected');
        } else {
            status.classList.remove('connected');
        }
    }

    // 새 공지 추가
    function addPost(post) {
        // 중복 체크
        if (posts.some(p => p.postId === post.postId)) {
            console.log('이미 존재하는 공지:', post.postId);
            return;
        }

        posts.unshift(post); // 최신 공지를 맨 위에
        renderPostsList();
    }

    // 공지사항 목록 렌더링
    function renderPostsList() {
        const postsList = document.getElementById('postsList');

        if (posts.length === 0) {
            postsList.innerHTML = '<div class="empty-state">공지사항이 없습니다</div>';
            return;
        }

        postsList.innerHTML = posts.map(post => `
                <div class="post-card ${selectedPost?.postId === post.postId ? 'selected' : ''}"
                     onclick="selectPost('${post.postId}')">
                    <div class="post-meta">
                        <div class="post-title">${escapeHtml(post.title || '제목 없음')}</div>
                        <span class="post-category category-${post.mainCategory}">
                            ${post.mainCategory} > ${post.subCategory}
                        </span>
                    </div>
                    <div class="post-info">
                        ${post.channelName} · ${post.userName} · ${formatDate(post.createdAt)}
                    </div>
                    ${post.deadline ? `<div class="post-info">📅 마감: ${formatDate(post.deadline)}</div>` : ''}
                    <div class="post-preview">${getPreview(post.content || post.position)}</div>
                </div>
            `).join('');
    }

    // 공지 선택
    function selectPost(postId) {
        selectedPost = posts.find(p => p.postId === postId);
        renderPostsList();
        renderPostDetail();
    }

    // 공지 상세 렌더링
    function renderPostDetail() {
        const viewer = document.getElementById('viewer');

        if (!selectedPost) {
            viewer.innerHTML = '<div class="empty-state">공지사항을 선택해주세요</div>';
            return;
        }

        if (currentView === 'markdown') {
            renderMarkdownView();
        } else {
            renderRawView();
        }
    }

    // 마크다운 뷰
    function renderMarkdownView() {
        const viewer = document.getElementById('viewer');
        const post = selectedPost;

        // 채용 공고인 경우
        let content = post.content;
        if (post.mainCategory === '취업' && post.subCategory === '채용') {
            content = `**직무:** ${post.position}\n\n`;
            if (post.url) {
                content += `**링크:** [지원하기](${post.url})\n\n`;
            }
            if (post.positionName) {
                content += `**분야:** ${post.positionName}\n\n`;
            }
        }

        viewer.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title">${escapeHtml(post.title || '제목 없음')}</div>
                    <div class="detail-meta">
                        <div class="meta-item">
                            <span>📁</span>
                            <span>${post.mainCategory} > ${post.subCategory}</span>
                        </div>
                        <div class="meta-item">
                            <span>👤</span>
                            <span>${post.userName}</span>
                        </div>
                        <div class="meta-item">
                            <span>📢</span>
                            <span>${post.channelName}</span>
                        </div>
                        <div class="meta-item">
                            <span>🕐</span>
                            <span>${formatDate(post.createdAt)}</span>
                        </div>
                        ${post.deadline ? `
                            <div class="meta-item">
                                <span>⏰</span>
                                <span>마감: ${formatDate(post.deadline)}</span>
                            </div>
                        ` : ''}
                        ${post.campusList ? `
                            <div class="meta-item">
                                <span>🏫</span>
                                <span>${post.campusList}</span>
                            </div>
                        ` : ''}
                    </div>
                </div>
                <div class="markdown-content">
                    ${marked.parse(content || '')}
                </div>
            `;
    }

    // 원본 텍스트 뷰
    function renderRawView() {
        const viewer = document.getElementById('viewer');
        const post = selectedPost;

        const rawText = `제목: ${post.title}
카테고리: ${post.mainCategory} > ${post.subCategory}
작성자: ${post.userName}
채널: ${post.channelName}
작성일: ${post.createdAt}
${post.deadline ? `마감일: ${post.deadline}` : ''}
${post.campusList ? `캠퍼스: ${post.campusList}` : ''}
${post.positionName ? `직무: ${post.positionName}` : ''}
${post.url ? `URL: ${post.url}` : ''}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━
원본 내용 (이스케이프 표시):
━━━━━━━━━━━━━━━━━━━━━━━━━━━━

${showEscapeCharacters(post.content || post.position || '')}`;

        viewer.innerHTML = `<div class="raw-view">${escapeHtml(rawText)}</div>`;
    }

    // 뷰 전환
    function switchView(view) {
        currentView = view;

        // 버튼 활성화 상태 변경
        document.querySelectorAll('.toggle-group button').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');

        renderPostDetail();
    }

    // 목록 초기화
    function clearPosts() {
        if (confirm('모든 공지사항 목록을 초기화하시겠습니까?')) {
            posts = [];
            selectedPost = null;
            renderPostsList();
            renderPostDetail();
        }
    }

    // 유틸리티 함수들
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        return date.toLocaleString('ko-KR', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function getPreview(text) {
        if (!text) return '';
        return text.replace(/\n/g, ' ').substring(0, 100) + '...';
    }

    function showEscapeCharacters(text) {
        return text
            .replace(/\n/g, '\\n\n')
            .replace(/\t/g, '\\t');
    }

    // 페이지 로드 시 자동 연결 (선택사항)
    // window.addEventListener('load', connectSSE);
</script>
</body>
</html>
