<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRHAM SSE 테스트 (쿠키 인증)</title>
    <style>
        /* 기존 스타일 유지 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .section {
            padding: 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .status-box {
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
        }

        .status-box.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status-box.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-box.waiting {
            background: #fef3c7;
            color: #92400e;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            margin: 10px 0;
        }

        .console {
            background: #1a202c;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow-y: auto;
        }

        .console-line.info { color: #63b3ed; }
        .console-line.success { color: #68d391; }
        .console-line.error { color: #fc8181; }

        .post-item {
            background: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 15px 0;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📢 PRHAM SSE 테스트</h1>
    </div>

    <div class="section">
        <h2>🔐 Step 1: 인증</h2>

        <label>Access Token:</label>
        <input type="text" id="accessToken" placeholder="eyJhbGc...">

        <label>Refresh Token (선택):</label>
        <input type="text" id="refreshToken" placeholder="eyJhbGc...">

        <button class="btn btn-primary" onclick="setTokenCookie()">
            🍪 쿠키 설정 (API 호출)
        </button>
        <button class="btn btn-danger" onclick="logout()">
            🚪 로그아웃 (쿠키 삭제)
        </button>

        <div id="authStatus" class="status-box waiting">
            ⏳ 토큰을 입력하고 "쿠키 설정" 버튼을 클릭하세요
        </div>
    </div>

    <div class="section">
        <h2>🔗 Step 2: SSE 연결</h2>

        <button class="btn btn-primary" onclick="connectSSE()">
            ▶️ SSE 연결
        </button>
        <button class="btn btn-danger" onclick="disconnectSSE()">
            ⏸️ 연결 끊기
        </button>

        <div id="sseStatus" class="status-box waiting">
            ⏳ SSE 연결 대기 중
        </div>
    </div>

    <div class="section">
        <h2>📋 수신한 공지</h2>
        <div id="posts"></div>
    </div>

    <div class="section">
        <h2>🖥️ 콘솔</h2>
        <div class="console" id="console"></div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8080';
    let eventSource = null;

    function addLog(message, type = 'info') {
        const consoleDiv = document.getElementById('console');
        const timestamp = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.className = `console-line ${type}`;
        line.textContent = `[${timestamp}] ${message}`;
        consoleDiv.appendChild(line);
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function updateStatus(elementId, message, className) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.className = `status-box ${className}`;
    }

    // ✅ 백엔드 API로 쿠키 설정
    async function setTokenCookie() {
        const accessToken = document.getElementById('accessToken').value.trim();
        const refreshToken = document.getElementById('refreshToken').value.trim();

        if (!accessToken) {
            alert('Access Token을 입력하세요!');
            return;
        }

        // Bearer 제거
        const cleanAccessToken = accessToken.replace('Bearer ', '');
        const cleanRefreshToken = refreshToken ? refreshToken.replace('Bearer ', '') : null;

        try {
            addLog('🔄 백엔드 API로 쿠키 설정 중...', 'info');

            const response = await fetch(`${API_BASE}/api/v1/auth/test/set-cookie`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',  // ✅ 쿠키 전달/저장
                body: JSON.stringify({
                    accessToken: cleanAccessToken,
                    refreshToken: cleanRefreshToken
                })
            });

            if (response.ok) {
                addLog('✅ 쿠키 설정 완료!', 'success');
                updateStatus('authStatus', '✅ 인증 완료 - SSE 연결 가능', 'success');

                // 쿠키 확인
                addLog('🍪 쿠키 확인: ' + document.cookie, 'info');
            } else {
                addLog('❌ 쿠키 설정 실패: ' + response.status, 'error');
                updateStatus('authStatus', '❌ 쿠키 설정 실패', 'error');
            }
        } catch (error) {
            addLog('❌ API 호출 실패: ' + error.message, 'error');
            updateStatus('authStatus', '❌ API 호출 실패', 'error');
        }
    }

    // ✅ 로그아웃 (백엔드 API 호출)
    async function logout() {
        try {
            addLog('🔄 로그아웃 중...', 'info');

            const response = await fetch(`${API_BASE}/api/v1/auth/logout`, {
                method: 'POST',
                credentials: 'include'
            });

            if (response.ok) {
                addLog('✅ 로그아웃 완료', 'success');
                updateStatus('authStatus', '⏳ 토큰을 입력하세요', 'waiting');
                disconnectSSE();
            }
        } catch (error) {
            addLog('❌ 로그아웃 실패: ' + error.message, 'error');
        }
    }

    // SSE 연결
    function connectSSE() {
        if (eventSource) {
            addLog('⚠️ 이미 연결되어 있습니다', 'info');
            return;
        }

        addLog('🔄 SSE 연결 시도...', 'info');
        updateStatus('sseStatus', '🔄 연결 중...', 'waiting');

        eventSource = new EventSource(`${API_BASE}/api/v1/posts/stream`, {
            withCredentials: true
        });

        eventSource.addEventListener('connected', (e) => {
            addLog('✅ SSE 연결 성공: ' + e.data, 'success');
            updateStatus('sseStatus', '✅ 연결됨 - 공지 수신 대기', 'success');
        });

        eventSource.addEventListener('newPost', (e) => {
            const post = JSON.parse(e.data);
            addLog('📢 새 공지: ' + post.title, 'success');
            displayPost(post);
        });

        eventSource.onerror = (e) => {
            addLog('❌ SSE 에러 (인증 실패?)', 'error');
            updateStatus('sseStatus', '❌ 연결 에러', 'error');
            console.error('SSE Error:', e);
        };
    }

    function disconnectSSE() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
            addLog('🔌 SSE 연결 종료', 'info');
            updateStatus('sseStatus', '⏸️ 연결 끊김', 'waiting');
        }
    }

    function displayPost(post) {
        const postsDiv = document.getElementById('posts');
        const postDiv = document.createElement('div');
        postDiv.className = 'post-item';
        postDiv.innerHTML = `
                <strong>${post.title || '제목 없음'}</strong><br>
                ${(post.content || '').substring(0, 200)}...<br>
                <small>카테고리: ${post.mainCategory} / ${post.subCategory}</small>
            `;
        postsDiv.insertBefore(postDiv, postsDiv.firstChild);
    }

    window.addEventListener('load', () => {
        addLog('🚀 페이지 로드 완료', 'success');
        addLog('💡 사용법:', 'info');
        addLog('  1. Access Token 입력', 'info');
        addLog('  2. "쿠키 설정" 버튼 클릭', 'info');
        addLog('  3. "SSE 연결" 버튼 클릭', 'info');
    });

    window.addEventListener('beforeunload', () => {
        disconnectSSE();
    });
</script>
</body>
</html>
