<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SSE 테스트</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .waiting { background: #fff3cd; color: #856404; }
        .post {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            background: #f8f9fa;
        }
        .post h3 { margin: 0 0 10px 0; color: #007bff; }
        .post p { margin: 5px 0; }
        .label { font-weight: bold; color: #666; }
        #logs {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            background: #fff;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
<h1>🔔 SSE 실시간 공지사항 테스트</h1>

<div id="status" class="waiting">⏳ 연결 대기 중...</div>

<button onclick="connect()" style="padding: 10px 20px; margin-right: 10px;">🔌 연결</button>
<button onclick="disconnect()" style="padding: 10px 20px;">❌ 연결 끊기</button>

<h2>📬 수신된 공지사항</h2>
<div id="posts"></div>

<h2>📋 로그</h2>
<div id="logs"></div>

<script>
    let eventSource = null;

    function addLog(message, type = 'info') {
        const logs = document.getElementById('logs');
        const time = new Date().toLocaleTimeString();
        const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue';
        logs.innerHTML = `<div style="color: ${color}">[${time}] ${message}</div>` + logs.innerHTML;
    }

    function updateStatus(message, className) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.className = className;
    }

    function connect() {
        if (eventSource) {
            addLog('이미 연결되어 있습니다.', 'error');
            return;
        }

        addLog('SSE 연결 시도 중...', 'info');
        updateStatus('⏳ 연결 중...', 'waiting');

        // 쿠키가 자동으로 전송됩니다
        eventSource = new EventSource('http://localhost:8080/api/v1/posts/stream');

        eventSource.addEventListener('connected', (event) => {
            addLog('✅ 연결 성공: ' + event.data, 'success');
            updateStatus('✅ SSE 연결됨', 'connected');
        });

        eventSource.addEventListener('newPost', (event) => {
            addLog('📬 새 공지사항 수신', 'success');

            try {
                const post = JSON.parse(event.data);
                displayPost(post);
            } catch (e) {
                addLog('❌ 파싱 실패: ' + e.message, 'error');
            }
        });

        eventSource.onerror = (error) => {
            addLog('❌ 연결 오류 발생', 'error');
            updateStatus('❌ 연결 실패', 'disconnected');
            console.error('SSE Error:', error);
        };
    }

    function disconnect() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
            addLog('🔌 연결 종료', 'info');
            updateStatus('🔌 연결 끊김', 'disconnected');
        }
    }

    function displayPost(post) {
        const postsDiv = document.getElementById('posts');
        const postDiv = document.createElement('div');
        postDiv.className = 'post';

        postDiv.innerHTML = `
                <h3>${post.title || '제목 없음'}</h3>
                <p><span class="label">ID:</span> ${post.id}</p>
                <p><span class="label">카테고리:</span> ${post.mainCategory} > ${post.subCategory}</p>
                <p><span class="label">채널:</span> ${post.channelName} (${post.teamName})</p>
                <p><span class="label">캠퍼스:</span> ${post.campusList || '전체'}</p>
                <p><span class="label">작성자:</span> ${post.userName}</p>
                <p><span class="label">마감일:</span> ${post.deadline || '없음'}</p>
                <p><span class="label">내용:</span> ${post.content}</p>
                <p><span class="label">생성시간:</span> ${post.createdAt}</p>
                ${post.positionName ? `<p><span class="label">포지션:</span> ${post.positionName}</p>` : ''}
                <small style="color: #666;">수신: ${new Date().toLocaleString()}</small>
            `;

        postsDiv.insertBefore(postDiv, postsDiv.firstChild);
    }

    // 페이지 로드 시 자동 연결 (선택사항)
    // window.onload = connect;
</script>
</body>
</html>
