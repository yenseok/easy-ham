# Compose v2: version 키 생략 권장
services:
  # --- Backend (Spring Boot, Gradle 빌드 산출물 실행) ---
  backend:
    image: bonghyerin/prham-backend:${TAG:-latest}
    container_name: app-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mymm_db}?useSSL=false&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-prham_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-prham_password}
      TZ: Asia/Seoul
      # 필요 시 JVM 옵션
      # JAVA_OPTS: "-Xms256m -Xmx512m"
    expose:
      - '8080'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:8080/actuator/health | grep -q ''"status":"UP"'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks: [app-net]

  # --- Frontend (Nginx로 정적 서빙 + SPA 라우팅) ---
  frontend:
    image: bonghyerin/prham-frontend:${TAG:-latest}
    container_name: app-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app-frontend
    ports:
      - '80:80' # 우선 HTTP만 오픈(SSL은 443 추가)
      # - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks: [app-net]

  # --- MySQL ---
  mysql:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: app-mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --lower_case_table_names=2
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mymm_db}
      MYSQL_USER: ${MYSQL_USER:-prham_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-prham_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '${MYSQL_HOST_PORT:-3306}:3306'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks: [app-net]


  mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: app-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-prham_db}
      TZ: Asia/Seoul
    volumes:
      - mongodb-data:/data/db
    ports:
      - '${MONGO_HOST_PORT:-27017}:27017'
    restart: always
    networks: [app-net]

volumes:
  mysql-data:
  # mongodb-data:

networks:
  app-net:
    driver: bridge
