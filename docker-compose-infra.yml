version: '3.8'

services:

  jenkins:
    image: jenkins/jenkins:lts
    container_name: app-jenkins
    user: root
    ports:
      - "9006:8080"
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    volumes:
      - ./jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    networks:
      - app-net
      
  # ===============================
  # 🗄️ MySQL
  # ===============================
  mysql:
    image: mysql:8.0
    container_name: app-mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --lower_case_table_names=2
    environment:
      MYSQL_DATABASE: prham
      MYSQL_USER: admin
      MYSQL_PASSWORD: Rocm316497!
      MYSQL_ROOT_PASSWORD: mma_root_pw!
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - app-net

  # ===============================
  # 🍃 MongoDB
  # ===============================
  mongodb:
    image: mongo:7.0
    container_name: app-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: rocm316497!
      MONGO_INITDB_DATABASE: prham_db
      TZ: Asia/Seoul
    volumes:
      - mongodb-data:/data/db
    ports:
      - '27017:27017'
    restart: always
    networks:
      - app-net

volumes:
  mysql-data:
  mongodb-data:

networks:
  app-net:
    name: app-net    # 명시적으로 이름 지정
    driver: bridge
