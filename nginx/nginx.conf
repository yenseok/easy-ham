# --- HTTP (redirect to HTTPS) ---
server {
    listen 80;
    server_name pyeonriham.site www.pyeonriham.site;
    return 301 https://$host$request_uri;
}

# --- HTTPS (SSL) ---
server {
    listen 443 ssl;
    server_name pyeonriham.site www.pyeonriham.site;

    ssl_certificate /etc/letsencrypt/live/pyeonriham.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyeonriham.site/privkey.pem;

    root /usr/share/nginx/html;
 
    
    # --- Backend API (최우선) ---
    location /api/ {
        proxy_pass http://app-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSAFY OAuth ---
    location /oauth2/ {
        proxy_pass http://app-backend:8080;
    }

    location /login/ {
        proxy_pass http://app-backend:8080;
    }

    location /logout/ {
        proxy_pass http://app-backend:8080;
    }

    # --- Jenkins ---
    location /jenkins/ {
        proxy_pass http://app-jenkins:8080/jenkins/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_read_timeout 300;
    }

    # --- Frontend (Vue fallback) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}


# --- SSAFY SSO용 프록시 --- 
server {
    listen 443 ssl;
    server_name k13a105.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/pyeonriham.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyeonriham.site/privkey.pem;

    # --- Frontend ---
    location / {
        proxy_pass http://app-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend API ---
    location /api/ {
        proxy_pass http://app-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSAFY OAuth 경로 ---
    location /oauth2/ {
        proxy_pass http://app-backend:8080;
    }

    location /login/ {
        proxy_pass http://app-backend:8080;
    }

    location /logout/ {
        proxy_pass http://app-backend:8080;
    }
}
